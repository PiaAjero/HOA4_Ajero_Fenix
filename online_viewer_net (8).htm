<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple To-Do List</title>
    <style>
 body{
  background-image: url('https://i.pinimg.com/1200x/2c/90/2f/2c902f18657197b9a463f94b746e187b.jpg ');
     
     
 }
  nav {
      background-color:#734a40;
            text-align:center;
            padding: 20px;
            margin: 35px;
            box-shadow: 0 10px 20px White;
        }

        nav a {
            color: pink;
            text-decoration: none;
            margin: 35px;
            font-weight: bold;
            border: 2px solid pink;
            font-size: 20px;

            border-radius: 9px;
        }

        nav a:hover {
            text-decoration: underline;
        }
        
     hr{
         border: none;
         border-top: 2px solid pink;
         margin: 35px;
}


        .todo-container {
            background-color:#734a40;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px white;
            width: 100%;
            max-width: 400px;
            margin: auto;
        }

        h2 {
            margin-top: 0;
            color: pink;
            text-align: center;
        }

        .input-section {
            display: flex;
            margin-bottom: 20px;
        }

        #todo-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px 0 0 4px;
            font-size: 16px;
            outline: none;
        }

        #add-btn {
            padding: 10px 20px;
            border: none;
            background-color: pink;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 0 4px 4px 0;
            transition: background-color 0.2s;
        }

        #add-btn:hover {
            background-color:#f7578f ;
        }

        ul {
list-style-type: none;
            padding: 0;
            margin: 0;

        }

        li {
            display: flex;
            align-items: center;
            padding: 12px;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
        }
       .todo-checkbox {
    margin-right: 12px;
    width: 18px;
    height: 18px;
    cursor: pointer;
    
    
       }


        .task-text {
            font-size: 16px;
            color: black;
            word-break: break-all;
        }


        li.completed .task-text {
            text-decoration: line-through;
            color: #aaaaaa;
        }
    </style>
</head>
<body>
   <nav>

        <a href="home.html">Home</a>

        <a href="planner.html">Planner</a>

        <a href="https://docs.google.com/document/d/1hI-58NzC30gv9-y6NQe6j7y7ZPZPR2N8E4PrdkF-BbM/mobilebasic">Schedule</a>

        <a href="note.hmtl">Notes</a>
 <hr />
    </nav>

    <div class="todo-container">
        <h2>To-Do List</h2>
        
        <div class="input-section">
            <input type="text" id="todo-input" placeholder="Enter task..." autocomplete="off">
            <button id="add-btn">Add</button>
        </div>

        <ul id="todo-list">
        </ul>
    </div>

    <script>
        const todoInput = document.getElementById('todo-input');
        const addBtn = document.getElementById('add-btn');
        const todoList = document.getElementById('todo-list');

        function addTask() {
            const taskText = todoInput.value.trim();

            const li = document.createElement('li');

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'todo-checkbox';

            const textSpan = document.createElement('span');
            textSpan.className = 'task-text';
            textSpan.textContent = taskText;

            li.appendChild(checkbox);
            li.appendChild(textSpan);

            li.addEventListener('click', function(event) {

                if (event.target !== checkbox) {
                    checkbox.checked = !checkbox.checked;
                }

                li.classList.toggle('completed', checkbox.checked);
            });
            todoList.appendChild(li);

            todoInput.value = '';
        }

        addBtn.addEventListener('click', addTask);

        todoInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                addTask();
            }
        });
    </script>

</body>
</html>
